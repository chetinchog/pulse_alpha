# ============================================
# PULSEALPHA - Docker Compose (Desarrollo)
# ============================================
# Ejecutar: docker compose up -d
# ============================================

version: '3.9'

services:
  # ==========================================
  # DATABASE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: pulsealpha-postgres
    environment:
      POSTGRES_DB: pulsealpha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: pulsealpha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # AI - OLLAMA
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: pulsealpha-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Para GPU NVIDIA, descomentar:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsealpha-backend
    environment:
      - DATABASE_URL=postgres://postgres:dev_password@postgres:5432/pulsealpha?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral:7b
      - ENV=development
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
    # Para hot reload en desarrollo
    command: air -c .air.toml

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsealpha-frontend
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_WS_URL=ws://localhost:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
  redis_data:
  ollama_data:

# ==========================================
# NETWORKS (opcional, Docker crea uno por defecto)
# ==========================================
networks:
  default:
    name: pulsealpha-network
